<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Incoming Log · RP Digital Trend</title>
<style>
:root{--bg:#0b141a;--panel:#111b21;--card:#202c33;--line:#2a3942;--text:#e9edef;--sub:#8696a0;--accent:#00a884;--ok:#25d366;--warn:#f0b429}
@media (prefers-color-scheme:light){:root{--bg:#f0f2f5;--panel:#fff;--card:#f0f2f5;--line:#e1e4e6;--text:#111b21;--sub:#667781}}
*{box-sizing:border-box;margin:0}
body{font:14px/1.45 "Segoe UI",Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text)}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
header{display:flex;align-items:center;gap:10px;padding:12px 20px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap;position:sticky;top:0;z-index:3}
header h1{font-size:18px;font-weight:600;flex:1;min-width:150px}
select,input[type=text]{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:7px 10px}
.btn{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:7px 12px;cursor:pointer;text-decoration:none;display:inline-block}
.btn:hover{filter:brightness(1.15)}
.live{font-size:12px;padding:3px 10px;border-radius:12px;background:var(--card);color:var(--sub)}
.live.on{color:var(--ok)}
main{max-width:1400px;margin:0 auto;padding:16px 20px;display:grid;gap:16px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 16px}
.stat b{display:block;font-size:26px;font-weight:600}
.stat span{color:var(--sub);font-size:13px}
.cols{display:grid;grid-template-columns:minmax(320px,430px) 1fr;gap:16px;align-items:start}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.card h2{font-size:15px;font-weight:600;padding:12px 14px;border-bottom:1px solid var(--line);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.card h2 .sp{flex:1}
.scroll{max-height:68vh;overflow:auto}
table{width:100%;border-collapse:collapse}
th{position:sticky;top:0;background:var(--panel);text-align:left;color:var(--sub);font-weight:500;font-size:12.5px;padding:8px 12px;border-bottom:1px solid var(--line)}
td{padding:8px 12px;border-bottom:1px solid var(--line);vertical-align:top}
tr.pick{cursor:pointer}
tr.pick:hover td,tr.sel td{background:var(--card)}
.num{color:var(--ok);white-space:nowrap}
.cnt{font-weight:600;text-align:right;white-space:nowrap}
.sub{color:var(--sub);font-size:12.5px}
.msg{white-space:pre-wrap;overflow-wrap:anywhere}
.tag{font-size:11.5px;padding:1px 7px;border-radius:9px;background:var(--card);color:var(--sub)}
.bar{display:flex;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.bar input{flex:1;min-width:140px}
.empty{padding:26px 14px;color:var(--sub);text-align:center}
.chipf{display:none;align-items:center;gap:6px;background:var(--card);padding:3px 4px 3px 10px;border-radius:14px;font-size:13px}
.chipf.on{display:inline-flex}
.chipf button{background:none;border:0;cursor:pointer;color:var(--sub);padding:2px 8px}
details.api{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 16px}
details.api summary{cursor:pointer;font-weight:600}
.ep{display:flex;gap:8px;align-items:center;margin-top:10px;flex-wrap:wrap}
.ep code{flex:1;min-width:260px;background:var(--card);padding:7px 10px;border-radius:8px;font:12.5px ui-monospace,Menlo,Consolas,monospace;overflow-wrap:anywhere}
.ep small{color:var(--sub);flex-basis:100%}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#323b41;color:#fff;padding:9px 16px;border-radius:10px;display:none;z-index:9}
@media (max-width:900px){.cols{grid-template-columns:1fr}main{padding:12px}.stats{grid-template-columns:1fr 1fr 1fr;gap:8px}.stat b{font-size:20px}}
</style>
</head>
<body>
<header>
  <h1>Incoming messages log</h1>
  <span class="live" id="live">connecting…</span>
  <select id="sess" aria-label="WhatsApp session"></select>
  <a class="btn" id="csv" href="#">Download CSV</a>
  <a class="btn" id="toDash" href="/dashboard.html">Chats</a>
</header>

<main>
  <div class="stats">
    <div class="stat"><b id="sTotal">0</b><span>Total messages received</span></div>
    <div class="stat"><b id="sNums">0</b><span>Different numbers</span></div>
    <div class="stat"><b id="sToday">0</b><span>Messages today</span></div>
  </div>

  <div class="cols">
    <section class="card">
      <h2>Messages per number</h2>
      <div class="scroll"><table>
        <thead><tr><th>Number</th><th style="text-align:right">Messages</th></tr></thead>
        <tbody id="nums"></tbody>
      </table></div>
    </section>

    <section class="card">
      <h2>Log <span class="chipf" id="chipf"><span id="chipT"></span><button id="chipX" aria-label="Clear number filter">✕</button></span><span class="sp"></span><span class="sub" id="shown"></span></h2>
      <div class="bar">
        <input type="text" id="q" placeholder="Search text, name or number" aria-label="Search log">
        <select id="range" aria-label="Date range"><option value="0">All time</option><option value="today">Today</option><option value="7">Last 7 days</option></select>
        <select id="limit" aria-label="Rows"><option>100</option><option>300</option><option>1000</option></select>
      </div>
      <div class="scroll"><table>
        <thead><tr><th>Time</th><th>From</th><th>Message</th></tr></thead>
        <tbody id="log"></tbody>
      </table></div>
    </section>
  </div>

  <details class="api">
    <summary>Use as API</summary>
    <div id="eps"></div>
  </details>
</main>
<div class="toast" id="toast" role="status"></div>

<script>
const $=s=>document.querySelector(s);
let SESSION=new URLSearchParams(location.search).get('session')||localStorage.getItem('wa_session')||'default';
let pickNum='',timer=null;
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const TZ={timeZone:'Asia/Kolkata'};
const when=t=>new Date(t*1000).toLocaleString('en-IN',{...TZ,day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:true});
const ICON={image:'📷 Photo',video:'🎥 Video',audio:'🎤 Voice message',sticker:'Sticker',document:'📄 Document',location:'📍 Location',contact:'👤 Contact',other:'Message'};
const body=e=>e.kind==='text'?e.text:(ICON[e.kind]||'Message')+(e.text?' — '+e.text:'');
async function api(p){const r=await fetch(p);const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||r.statusText);return j}
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(t._t);t._t=setTimeout(()=>t.style.display='none',2500)}

function logUrl(extra=''){
  const p=new URLSearchParams();
  if(pickNum)p.set('number',pickNum);
  if($('#q').value.trim())p.set('q',$('#q').value.trim());
  const r=$('#range').value;
  if(r==='today'){const d=new Date(new Date().toLocaleString('en-US',TZ));d.setHours(0,0,0,0);p.set('since',Math.floor((Date.now()-(new Date(new Date().toLocaleString('en-US',TZ))-d))/1000))}
  else if(r!=='0')p.set('since',Math.floor(Date.now()/1000)-r*86400);
  return p.toString();
}
async function loadSummary(){
  const d=await api(`/api/incoming/${SESSION}/summary`);
  $('#sTotal').textContent=d.total_messages;$('#sNums').textContent=d.total_numbers;$('#sToday').textContent=d.today_messages;
  $('#nums').innerHTML=d.numbers.length?d.numbers.map(n=>`<tr class="pick ${n.number&&n.number===pickNum?'sel':''}" data-n="${esc(n.number)}" data-t="${esc(n.phone||n.name)}"><td><div class="num">${esc(n.phone||'Number hidden')}</div><div class="sub">${esc(n.name)}${n.name?' · ':''}last ${when(n.last_ts)}</div></td><td class="cnt">${n.count}</td></tr>`).join(''):'<tr><td class="empty" colspan="2">No messages yet. Numbers appear here as soon as someone writes to you.</td></tr>';
}
async function loadLog(){
  const lim=$('#limit').value;
  const d=await api(`/api/incoming/${SESSION}?limit=${lim}&${logUrl()}`);
  $('#shown').textContent=`${d.count} of ${d.total}`;
  $('#log').innerHTML=d.messages.length?d.messages.map(e=>`<tr><td class="sub" style="white-space:nowrap">${when(e.ts)}</td><td><div class="num">${esc(e.phone||'Number hidden')}</div><div class="sub">${esc(e.name)}${e.group?' <span class="tag">group</span>':''}</div></td><td class="msg">${esc(body(e))}</td></tr>`).join(''):'<tr><td class="empty" colspan="3">Nothing matches. Clear the filters or wait for new messages.</td></tr>';
  $('#csv').href=`/api/incoming/${SESSION}/export.csv?${logUrl()}`;
}
const refresh=()=>Promise.all([loadSummary(),loadLog()]).catch(e=>toast(e.message));
const soon=()=>{clearTimeout(timer);timer=setTimeout(refresh,400)};

$('#nums').addEventListener('click',e=>{
  const r=e.target.closest('tr.pick');if(!r||!r.dataset.n)return;
  pickNum=r.dataset.n;$('#chipT').textContent=r.dataset.t||pickNum;$('#chipf').classList.add('on');refresh();
});
$('#chipX').onclick=()=>{pickNum='';$('#chipf').classList.remove('on');refresh()};
$('#q').oninput=soon;$('#range').onchange=refresh;$('#limit').onchange=refresh;

function endpoints(){
  const o=location.origin,s=SESSION;
  const list=[
    [`${o}/api/incoming/${s}?limit=100`,'All incoming messages, newest first. Optional: number, q, kind, group=true|false, since (unix time), limit (max 1000), offset.'],
    [`${o}/api/incoming/${s}?number=7015373621`,'Messages from one number (10-digit or full number with country code).'],
    [`${o}/api/incoming/${s}/summary`,'How many messages each number sent, plus totals and today’s count.'],
    [`${o}/api/incoming/${s}/export.csv`,'Same log as a CSV file.']
  ];
  $('#eps').innerHTML=list.map(([u,d])=>`<div class="ep"><code>GET ${esc(u)}</code><button class="btn" data-u="${esc(u)}">Copy</button><small>${esc(d)}</small></div>`).join('');
}
$('#eps').addEventListener('click',e=>{const b=e.target.closest('button[data-u]');if(b)navigator.clipboard.writeText(b.dataset.u).then(()=>toast('Link copied'))});

function connect(){
  const es=new EventSource(`/api/wa/${SESSION}/events`);
  es.onopen=()=>{$('#live').textContent='live';$('#live').classList.add('on')};
  es.onerror=()=>{$('#live').textContent='reconnecting…';$('#live').classList.remove('on')};
  es.addEventListener('message',e=>{if(!JSON.parse(e.data).msg.fromMe)soon()});
}
(async()=>{
  localStorage.setItem('wa_session',SESSION);
  $('#toDash').href='/dashboard.html?session='+encodeURIComponent(SESSION);
  try{const l=await api('/api/sessions');if(!l.some(s=>s.name===SESSION))l.push({name:SESSION});$('#sess').innerHTML=l.map(s=>`<option ${s.name===SESSION?'selected':''}>${esc(s.name)}</option>`).join('')}catch(e){}
  $('#sess').onchange=e=>{localStorage.setItem('wa_session',e.target.value);location.href='/incoming.html?session='+encodeURIComponent(e.target.value)};
  endpoints();await refresh();connect();
})();
</script>
</body>
</html>
